databases:
  - name: nexora-search-db
    databaseName: nexora_search
    user: nexora_search
    plan: free
    region: frankfurt

services:
  - type: web
    name: nexora-search
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: Nexora Search
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://nexora-search.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: nexora-search-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: AI_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: SEARCHAPI_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
